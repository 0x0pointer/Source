name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The chunking/indexing/search logic is tested with a fake embedder, so the heavy
      # ML dependencies (fastembed/onnxruntime) and the model download aren't needed here.
      - run: pip install numpy pytest
      - run: pytest -q
