[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-rag"
version = "0.1.0"
description = "Local, offline hybrid search over a folder of Markdown notes, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7",
    "numpy",
    "mcp>=1.2,<2",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# `pip install -e .` puts these on your PATH (an alternative to `.venv/bin/python build_index.py`).
[project.scripts]
source-build = "build_index:main"
source-query = "query:main"

[tool.setuptools]
py-modules = ["source_rag", "build_index", "query", "mcp_server", "eval_retrieval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
